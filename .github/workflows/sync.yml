name: Синхронизация календаря

on:
  schedule:
    - cron: "47 15 * * *"      # 19:47 по Ижевску — проверка пар на сайте колледжа
    - cron: "*/30 2-19 * * *"  # каждые 30 минут с 6:00 до 23:30 по Ижевску — задачи из приложения ↔ iCloud
    - cron: "5 19 * * *"       # 23:05 по Ижевску — перенос невыполненных задач на завтра
  workflow_dispatch:           # кнопка «Run workflow» для ручного запуска

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PW: ${{ secrets.APPLE_PW }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TZ: Europe/Samara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r sync/requirements.txt

      - name: Пары с сайта колледжа → iCloud «Учёба»
        if: github.event.schedule == '47 15 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: sync
        run: |
          python parse.py events.json
          python -W ignore sync.py events.json | tee changes.txt
          python report_changes.py changes.txt

      - name: Перенос невыполненных задач на завтра
        if: github.event.schedule == '5 19 * * *'
        working-directory: sync
        run: python -W ignore carry.py

      - name: Приложение ↔ iCloud
        working-directory: sync
        run: python -W ignore app_sync.py
